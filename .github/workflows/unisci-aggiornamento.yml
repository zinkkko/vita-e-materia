# La routine quotidiana prova a fare push direttamente su main.
# Se il suo ambiente le permette solo rami claude/..., questo workflow
# porta l'aggiornamento su main e rilancia la pubblicazione del sito.
name: Pubblica aggiornamento

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write
  pages: write

concurrency:
  group: unisci-main
  cancel-in-progress: false

jobs:
  unisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Porta il ramo su main
        env:
          RAMO: ${{ github.ref_name }}
        run: |
          git config user.name "vita-e-materia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit "origin/$RAMO"
          git push origin main
          git push origin --delete "$RAMO"
      - name: Rilancia GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
